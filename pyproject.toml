[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penny-stock-radar"
version = "0.1.0"
description = "Milestone 1 scaffold for a US penny stock premarket/regular-session radar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "httpx>=0.27,<0.29",
  "pandas>=2.2,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "rich>=13.7,<14.0",
  "joblib>=1.3,<2.0",
  "scikit-learn>=1.4,<2.0",
  "typer>=0.12,<1.0",
  "yfinance>=0.2.54,<0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<9.0",
]
ui = [
  "streamlit>=1.33,<2.0",
]

[project.scripts]
psradar = "penny_stock_radar.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
